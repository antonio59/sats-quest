name: Deploy Convex
on:
  push:
    branches: [main]
    paths: ['convex/**']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: ppnpm install
      - name: Deploy Convex
        run: |
          CONVEX_DEPLOYMENT=prod:combative-viper-883 pnpm exec convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
