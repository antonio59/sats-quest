name: Deploy Convex
on:
  push:
    branches: [main]
    paths: ['convex/**']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install
      - name: Deploy Convex
        run: |
          CONVEX_DEPLOYMENT=prod:combative-viper-883 bunx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
