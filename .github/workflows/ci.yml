name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint || echo "No lint script"

      - name: Type check
        run: bunx tsc --noEmit || echo "No TypeScript config"

      - name: Build
        run: bun run build

      - name: Audit dependencies
        run: bun audit || echo "Audit completed"
