name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: ppnpm install

      - name: Lint
        run: pnpm run lint || echo "No lint script"

      - name: Type check
        run: pnpm exec tsc --noEmit || echo "No TypeScript config"

      - name: Audit dependencies
        run: pnpm audit || echo "Audit completed"
